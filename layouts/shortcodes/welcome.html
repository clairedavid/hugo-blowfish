{{/* Welcome block. Wraps the markdown written between the shortcode tags and
     fades it in as a single piece, after the hn typewriter has finished. */}}

<style>
  .hn-welcome {
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    max-width: 54rem;
    margin-inline: auto;
    padding: 0 1rem 2rem;
    box-sizing: border-box;
    color: rgb(var(--color-neutral-700));
  }

  .dark .hn-welcome {
    color: rgb(var(--color-neutral-300));
  }

  /* "Welcome," - a letter-style greeting: left aligned, body size. */
  .hn-welcome .hn-greeting {
    margin: 0 0 1.25rem;
    text-align: left;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.7;
    color: rgb(var(--color-neutral-800));
  }

  .dark .hn-welcome .hn-greeting {
    color: rgb(var(--color-neutral-100));
  }

  /* Body paragraphs - left aligned, same size as the six notes */
  .hn-welcome p {
    margin: 0 0 1.25rem;
    text-align: left;
    font-size: 1rem;
    line-height: 1.7;
  }

  /* The Max Welling line - centred and italic, no theme quote bar */
  .hn-welcome blockquote {
    margin: 2rem 0;
    padding: 0;
    border: 0;
    text-align: center;
    font-style: italic;
  }

  .hn-welcome blockquote p {
    text-align: center;
    margin: 0;
  }

  /* Phone: drop the block well clear of the notes above it. */
  @media (max-width: 899.98px) {
    .hn-welcome {
      padding-top: 3.5rem;
    }
  }

  /* Single gentle opacity fade, starting after the last note is typed
     (the hn sequence ends ~4.8s). No movement. */
  @keyframes hn-welcome-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .hn-welcome {
    animation: hn-welcome-in 800ms ease-out both;
    animation-delay: 5000ms;
  }

  @media (prefers-reduced-motion: reduce) {
    .hn-welcome {
      animation: none !important;
      opacity: 1 !important;
    }
  }
</style>

<div class="hn-welcome">
  {{ .Inner | markdownify }}
</div>
